# Codemagic, iOS only: the Android build is made locally (gallaz key) and sent to
# Google Play by the API. Needs, in Codemagic: Team integrations → App Store Connect
# "codemagic" (App Manager key); signing certificates and profiles are created by
# Codemagic for the bundle id. The ios/ folder is generated by Expo prebuild (not
# committed), so app.json is the single source of the native settings.
definitions:
  deps: &deps
    name: Install dependencies
    script: npm ci --legacy-peer-deps
  prebuild: &prebuild
    name: Generate the native iOS project (runs pod install)
    script: npx expo prebuild --platform ios --clean

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.freedomfighter.boxbreathing
      vars:
        XCODE_SCHEME: "4MinutesBreathing"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    scripts:
      - *deps
      - *prebuild
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_SCHEME.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false  # upload only; TestFlight beta review needs test info in ASC

  ios-screenshots:
    name: iPhone screenshots (simulator)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "4MinutesBreathing"
        SIM_DEVICE: "iPhone 16 Pro Max"   # 6.9", 1320×2868: the one size App Store Connect still requires
    scripts:
      - *deps
      - *prebuild
      - name: Build for the simulator
        script: |
          xcodebuild -workspace "ios/$XCODE_SCHEME.xcworkspace" -scheme "$XCODE_SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | xcpretty || true
          ls build/sim/Build/Products/Release-iphonesimulator/*.app
      - name: Boot the simulator and take the screenshots
        script: |
          set -e
          APP=$(ls -d build/sim/Build/Products/Release-iphonesimulator/*.app | head -1)
          BUNDLE=com.freedomfighter.boxbreathing
          UDID=$(xcrun simctl create shots "$SIM_DEVICE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          # The texts are bilingual on screen (EN / FR), so one set serves both locales.
          # Deep links (simctl openurl) would raise the "Open in …?" confirmation, so the
          # scene is passed as launch arguments, read by the app through NSUserDefaults.
          seed() {  # seed SCENE SOUNDS — AsyncStorage keys in the app's data container
            C=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            S="$C/Library/Application Support/$BUNDLE/RCTAsyncLocalStorage_V1"
            mkdir -p "$S"
            printf '{"screenshotScene":"%s","screenshotSounds":"%s","sounds":"%s"}' "$1" "$2" "$2" > "$S/manifest.json"
          }
          shoot() {  # shoot NAME [SCENE SOUNDS [SECONDS]]
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            if [ -n "$2" ]; then
              seed "$2" "$3"
              xcrun simctl launch "$UDID" "$BUNDLE" -screenshotScene "$2" -screenshotSounds "$3"
            else
              xcrun simctl launch "$UDID" "$BUNDLE"
            fi
            sleep "${4:-6}"
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE" || echo "!! $1: the app is not running any more"
            xcrun simctl io "$UDID" screenshot "screenshots/$1.png"
          }
          shoot 01-home
          shoot 02-box      box      1 14
          shoot 03-478      478      1 9
          shoot 04-petal    petal    0 7
          shoot 05-coherent coherent 0 8
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/*4Minutes* crashes/ 2>/dev/null || true
          for f in crashes/*; do [ -f "$f" ] && { echo "== $f"; grep -o '"exception"[^}]*}' "$f" | head -3; grep -o '"termination"[^}]*}' "$f" | head -1; }; done
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'processImagePath contains "4MinutesBreathing" AND (messageType == error OR messageType == fault)' 2>/dev/null | tail -40 || true
          xcrun simctl shutdown "$UDID"
          ls -l screenshots/
    artifacts:
      - screenshots/*.png
      - crashes/*

  # One-off helper: creates the App Store provisioning profiles at Apple for the bundle
  # ids below, signed with the distribution certificate Codemagic already holds
  # (the one expiring 2027-03-02). Codemagic's own "Fetch profiles" only imports
  # profiles that exist, and the yaml `ios_signing` only uses imported ones, so a new
  # bundle id needs this (or the developer portal) once. Then: Settings → Code signing
  # identities → iOS provisioning profiles → Fetch profiles → tick the new ones.
  apple-profiles:
    name: "Apple: create App Store profiles"
    max_build_duration: 10
    instance_type: linux_x2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        BUNDLE_IDS: "com.freedomfighter.boxbreathing com.local2p.games"
        CERT_ID: "UV32QNP69H"   # "Apple Distribution: Pierre Gallaz", expires 2027-03-02 (from the listing step; "none" = list only)
    scripts:
      - name: Create the profiles
        script: |
          set -e
          echo "=== certificates (text)"; app-store-connect list-certificates || true
          echo "=== certificates (json)"; app-store-connect list-certificates --json || true
          for B in $BUNDLE_IDS; do
            echo "=== bundle id $B"; app-store-connect list-bundle-ids --bundle-id-identifier "$B" --platform IOS || true
          done
          echo "=== existing App Store profiles"; app-store-connect list-profiles --type IOS_APP_STORE || true
          if [ "$CERT_ID" != none ]; then
            for B in $BUNDLE_IDS; do
              BID=$(app-store-connect list-bundle-ids --bundle-id-identifier "$B" --platform IOS 2>/dev/null | sed -n 's/^Id: //p' | head -1)
              echo "$B → bundle id resource $BID"
              app-store-connect create-profile \
                --certificate-ids "$CERT_ID" \
                --type IOS_APP_STORE \
                --name "$B app store" \
                "$BID" || echo "(profile for $B not created: it may already exist)"
            done
          else
            echo "CERT_ID not set: listing only (set it in the workflow's vars from the listing above)"
          fi
